# Tapvio site settings.
site_name: "Tapvio"
site_tagline: "Free, open-source link-in-bio pages that search engines can actually find."
# Where this copy is served, no trailing slash. Asset and navigation links use it,
# so the GitHub Pages copy keeps working under /tapvio/.
# The official host is built with TAPVIO_SITE_URL set to that host; it then
# self-canonicalizes and ignores canonical_site_url.
site_url: "https://mafzalkalwardev.github.io/tapvio"
# Address search engines should treat as the product. Used for canonical, og:url,
# JSON-LD url/@id, the sitemap, robots and llms.txt. No trailing slash.
canonical_site_url: "https://tapvio.induswebagency.com"
custom_domain: ""
owner_name: "INDUS Web Agency"
owner_url: "https://induswebagency.com"
# GitHub repo (owner/name): used for "Create your page" and pull-request links.
repo: "mafzalkalwardev/tapvio"
branch: "main"
default_theme: "resume"
lang: "en"
# Paste only the content="..." token from Google Search Console / Bing Webmaster Tools.
google_site_verification: ""
bing_site_verification: ""
# IndexNow key (Bing, Yandex, Seznam, Naver). Any 32-char hex string; it is public by design.
indexnow_key: "2062ec5b941c96db67ed9b9f6fd1d1f2"
